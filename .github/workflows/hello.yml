name: Hello Workflow

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

env:
  APP_NAME: Integrations.Api
  ENVIRONMENT_NAME: Practice

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print first job message
        run: echo "This is the first job for $APP_NAME"

      - name: Show environment and runner OS
        run: echo "Environment is $ENVIRONMENT_NAME and runner is $RUNNER_OS"

  second-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -la

  third-job:
    needs:
      - first-job
      - second-job
    runs-on: ubuntu-latest

    steps:
      - name: Print third job message
        run: echo "This is the third job"

      - name: Show current date
        run: date

  fourth-job:
    needs:
      - first-job
      - second-job
    runs-on: ubuntu-latest

    steps:
      - name: Print fourth job message
        run: echo "This is the fourth job"

      - name: Finish workflow
        run: echo "All jobs completed in order"
