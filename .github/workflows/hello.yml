name: Hello Workflow

on:
  push:
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print first job message
        run: echo "This is the first job"

      - name: Show first job runner OS
        run: echo "Running on $RUNNER_OS"

  second-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print second job message
        run: echo "This is the second job"

      - name: Show current folder
        run: pwd
