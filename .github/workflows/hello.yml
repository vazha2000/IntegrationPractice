name: Hello Workflow

on:
  push:
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print first job message
        run: echo "This is the first job"

      - name: Show first job runner OS
        run: echo "Running on $RUNNER_OS"

  second-job-python:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Print second job message
        run: print("Hello World!")
        shell: python

  third-job:
    needs:
      - first-job
      - second-job-python
    runs-on: ubuntu-latest

    steps:
      - name: Print third job message
        run: echo "This is the third job"

      - name: Show current date
        run: date

  fourth-job:
    needs: third-job
    runs-on: ubuntu-latest

    steps:
      - name: Print fourth job message
        run: echo "This is the fourth job"

      - name: Finish workflow
        run: echo "All jobs completed in order"
