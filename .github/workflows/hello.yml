name: Hello Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'src/Integrations.Api/**'
      - '.github/workflows/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'src/Integrations.Api/**'
      - '.github/workflows/**'
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

env:
  APP_NAME: Integrations.Api
  ENVIRONMENT_NAME: Practice

jobs:
  first-job:
    runs-on: ubuntu-latest
    outputs:
      greeting: ${{ steps.create-output.outputs.greeting }}

    steps:
      - name: Print first job message
        run: echo "This is the first job for $APP_NAME"

      - name: Show environment and runner OS
        run: echo "Environment is $ENVIRONMENT_NAME and runner is $RUNNER_OS"

      - name: Create output
        id: create-output
        run: echo "greeting=Hello from first-job" >> "$GITHUB_OUTPUT"

  second-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -la

  third-job:
    needs:
      - first-job
      - second-job
    runs-on: ubuntu-latest

    steps:
      - name: Print third job message
        if: github.event_name == 'pull_request'
        run: echo "This step only runs for pull requests"

      - name: Show current date
        run: date

      - name: Print first job output
        run: echo "${{ needs.first-job.outputs.greeting }}"

  fourth-job:
    needs:
      - first-job
      - second-job
    runs-on: ubuntu-latest

    steps:
      - name: Print fourth job message
        run: echo "This is the fourth job"

      - name: Finish workflow
        run: echo "All jobs completed in order"
