services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: integration-foundations-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Integration_2026!"
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  integrations-api:
    build:
      context: .
      dockerfile: src/Integrations.Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: integrations-api
    container_name: integrations-api
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IntegrationFoundations;User Id=sa;Password=Integration_2026!;TrustServerCertificate=True"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
