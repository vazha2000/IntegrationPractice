services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: integration-foundations-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Integration_2026!"
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  integrations-api:
    build:
      context: .
      dockerfile: src/Integrations.Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: integrations-api
    container_name: integrations-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IntegrationFoundations;User Id=sa;Password=Integration_2026!;TrustServerCertificate=True"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
